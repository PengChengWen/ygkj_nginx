upstream fastcgi_backend {
    server 127.0.0.1:9443;
    #server unix:/dev/shm/php-fcgi.sock;
    keepalive 8;
}

server {
	listen      8443 ssl http2;
	listen      [::]:8443 ssl http2;
	server_name  localhost;
	ssi on;

	charset gbk;
	#ssl                  on;
	ssl_certificate      /opt/SJRJ/InG/etc/pki/tls/certs/localhost.crt;
	ssl_certificate_key  /opt/SJRJ/InG/etc/pki/tls/private/localhost.key;
	ssl_dhparam /opt/SJRJ/InG/etc/pki/tls/certs/dhparams.pem;
    absolute_redirect off;
    
	root /opt/SJRJ/InG/var/www/html;
	index admin/index.html;
	error_page 404  /;
	error_page 403  /;
	
	ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 10m;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_ciphers  HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers   on;
	
	location = /backend_status {
        include /opt/SJRJ/InG/etc/nginx/common/phpfpm_backend.conf;
    }
	
    include /opt/SJRJ/InG/etc/nginx/module/statistics.conf;
	include /opt/SJRJ/InG/etc/nginx/module/admin.conf;

	location ^~ /vendor {
		deny all;
		return 403;
    }

	location ~* /composer\.(json|lock)$ {
		deny all;
		return 403;
	}

	location ~ \.(php)?$ {
		include /opt/SJRJ/InG/etc/nginx/common/phpfpm_backend.conf;
		
	}

	location /wss {
		proxy_pass http://127.0.0.1:10000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Real-IP $remote_addr;
		keepalive_timeout 70;
		proxy_connect_timeout 4s;
		proxy_read_timeout 180s; 
		proxy_send_timeout 12s;
	}

}
