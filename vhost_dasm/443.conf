
server {
	listen 443 ssl;
	listen  [::]:443 ssl;
	ssi on;
	server_name localhost;
	
	#ssl                  on;
	ssl_certificate      /etc/pki/tls/certs/localhost.crt;
	ssl_certificate_key  /etc/pki/tls/private/localhost.key;
	ssl_dhparam /etc/pki/tls/certs/dhparams.pem;
	
	root /var/www/html;
	index asm_index_redirect.php index.php index.html index.htm;
	
	ssl_session_timeout  5m;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_ciphers  HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers   on;
	
	charset gbk;
	client_body_temp_path  /tmp/logs/nginx 1 2;
	error_page 404  =200 /;
	#分布式场景下DASM不再支持入网流程相关业务，直接跳转到管理地址
	# 新版入网流程
	location ^~ /access/ui {
		rewrite ^(.*) https://$host/admin break;
	}

	location ~ /a/(index.html|auth.html) {
		 rewrite ^(.*) https://$host/admin break;
	
	}
	location ~ /a2/(index.html|auth.html) {
		 rewrite ^(.*) https://$host/admin break;
	
	}
	# 手机端html页面请求
	location ~ /a/mobile/(.*) {
		rewrite ^(.*) https://$host/admin break;
	}
	location ~ /a2/mobile/(.*) {
		rewrite ^(.*) https://$host/admin break;
	}

	#对于URL中存在的特殊交易做例外处理
	if ($request_uri ~* "infoprocess|net_auth") {
		rewrite ^(.*) https://$host/admin break;
	}

	location ^~ /access {
		set $is_exist_filename 1;
		
		#对于URL中存在的特殊交易做例外处理
		if ($request_uri ~* "infoprocess|auth") {
			rewrite ^(.*) https://$host/admin break;
		}
		if ($request_filename != '/var/www/html/access/index.php') {
			set $is_exist_filename 0;
			rewrite ^(.*)$ /access/index.php?rewrite=$1 last;
		}
		# else
		if ($is_exist_filename = 1) {
			root /var/www/access.asm.com/webroot;
		}
		include /etc/nginx/common/phpfpm.conf;
	}

	location ~ /download/getip.php{
		echo IP:$remote_addr;
		break;
	}

	location ^~ /vendor {
                deny all;
                return 403;
        }

	location ~* /composer\.(json|lock)$ {
		deny all;
		return 403;
	}
	
	include /etc/nginx/module/compatible.conf;

	location ~ \.(php)?$ {
		include /etc/nginx/common/phpfpm.conf;
	}

	location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
		expires      30d;
	}

	location ~ .*\.(js|css)?$ {
		expires      12h;
	}
	location ~ .*\.(tgz|conf|rar)$ {
		set $forbid_flag 0;
		if ($remote_addr ~ (127.0.0.1|^191.*)) {
			set $forbid_flag "${forbid_flag}1";
		}
		if ($http_user_agent ~* 'wget') {
			set $forbid_flag "${forbid_flag}1";
		}
		if ($http_referer ~ ^$) {
			set $forbid_flag "${forbid_flag}2";
		}
		if ($request_uri ~* "/download/patchupdate.rar") {
			set $forbid_flag "${forbid_flag}3";
		}
		if ($forbid_flag = "02") {
			return 404;
		}
	}

}
