upstream fastcgi_frontend_dhcp {
    server 127.0.0.1:9999;
    #server unix:/dev/shm/php-fcgi.sock;
    keepalive 8;
}

server {
	listen       8181;
	listen       [::]:8181;
	server_name  localhost;

	set $subdomain '';
	root  /opt/SJRJ/InG/var/www/html/dhcpwebroot$subdomain;
	#root  /opt/SJRJ/InG/var/www/html;
	location / {
		index index.php;
		autoindex      off;
	}
	
	error_page  404   =200 /index.php;
	location ~ \.(php)?$ {
		fastcgi_pass fastcgi_frontend_dhcp;
		fastcgi_keep_conn on;
		fastcgi_param  DOCUMENT_ROOT      $document_root;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_ignore_client_abort on;
		include /opt/SJRJ/InG/etc/asm/nginx/*.conf;
		include fastcgi_params;
	}

}

