
server {
	listen 443 ssl http2;
	listen  [::]:443 ssl http2;
	ssi on;
	server_name localhost;
	
	charset gbk;
	#ssl                  on;
	ssl_certificate      /etc/pki/tls/certs/localhost.crt;
	ssl_certificate_key  /etc/pki/tls/private/localhost.key;
	ssl_dhparam /etc/pki/tls/certs/dhparams.pem;
	
	root /var/www/html;
	index asm_index_redirect.php index.php index.html index.htm;

	ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 10m;	
	ssl_protocols TLSv1.2;
	ssl_ciphers  HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers   on;
		

	client_body_temp_path  /tmp/logs/nginx 1 2;
	error_page 404  =200 /;
	
	location = /frontend_status {
        include /etc/nginx/common/phpfpm.conf;
    }
	
	location ~ /download/getip.php{
		echo IP:$remote_addr;
		break;
	}

	location ^~ /vendor {
                deny all;
                return 403;
        }

	location ~* /composer\.(json|lock)$ {
			deny all;
			return 403;
	}
	
	include /etc/nginx/module/access.conf;
	include /etc/nginx/module/compatible.conf;

	location ~ \.(php)?$ {
		include /etc/nginx/common/phpfpm.conf;
	}

	location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
	{
		expires      30d;
	}

	location ~ .*\.(js|css)?$
	{
		expires      12h;
	}

	location ~ ^(?!/download/)(.*)\.(tgz|conf)$
	{
		set $forbid_flag 0;
		if ($remote_addr ~ (127.0.0.1|^191.*))
		{
			set $forbid_flag "${forbid_flag}1";
		}
		if ($http_user_agent ~* 'wget')
		{
			set $forbid_flag "${forbid_flag}1";
		}
		if ($http_referer ~ ^$)
		{
			set $forbid_flag "${forbid_flag}2";
		}
		if ($forbid_flag = "02")
		{
			return 404;
		}
	}

}
