upstream fastcgi_backend_dhcp {
    server 127.0.0.1:9999;
    #server unix:/dev/shm/php-fcgi.sock;
    keepalive 8;
}

server {
	listen       8183 ssl;
	listen       [::]:8183 ssl;
	server_name  localhost;
	
	set $subdomain '';
	root  /opt/SJRJ/InG/var/www/html/dhcpwebroot$subdomain;
	
	charset gbk;
	#ssl                  on;
	ssl_certificate      /opt/SJRJ/InG/etc/pki/tls/certs/localhost.crt;
	ssl_certificate_key  /opt/SJRJ/InG/etc/pki/tls/private/localhost.key;
	ssl_dhparam /opt/SJRJ/InG/etc/pki/tls/certs/dhparams.pem;

	error_page 404  /;
	error_page 403  /;
	ssl_session_timeout  5m;

	ssl_protocols TLSv1.2;
	ssl_ciphers  HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers   on;
	
	location / {
		index  index.php;
		autoindex      off;
	}
	
	error_page  404   = /index.php;
	location ~ \.(php)?$ {
		fastcgi_pass fastcgi_backend_dhcp;
		fastcgi_keep_conn on;
		fastcgi_param  DOCUMENT_ROOT      $document_root;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_ignore_client_abort on;
		include /opt/SJRJ/InG/etc/asm/nginx/*.conf;
		include fastcgi_params;
	}
	#location / {
	#	proxy_set_header Host $host;
	#	proxy_set_header X-Real-IP $remote_addr;
	#	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	#	proxy_set_header X-Server-Addr $server_addr;
	#	proxy_pass http://127.0.0.1:9183;
	#}

}

