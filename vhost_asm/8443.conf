upstream fastcgi_backend {
    server 127.0.0.1:9443;
    #server unix:/dev/shm/php-fcgi.sock;
    keepalive 8;
}

server {
	listen      8443 ssl;
	listen      [::]:8443 ssl;
	http2 on;
	server_name  localhost;
	ssi on;

	charset gbk;
	#ssl                  on;
	include /opt/SJRJ/InG/etc/nginx/common/sslcert.conf;
	ssl_dhparam /opt/SJRJ/InG/etc/pki/tls/certs/dhparams.pem;
    absolute_redirect off;

	root /opt/SJRJ/InG/var/www/html;
	index index.html index.php;
	error_page 404  /;
	error_page 403  /;

    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 10m;

	ssl_ciphers  HIGH:!aNULL:!MD5:!kRSA;
	ssl_prefer_server_ciphers   on;

	include /opt/SJRJ/InG/etc/nginx/module/admin.conf;
	include /opt/SJRJ/InG/etc/nginx/module/statistics.conf;
	include /opt/SJRJ/InG/etc/nginx/module/ztpwss.conf;
}
