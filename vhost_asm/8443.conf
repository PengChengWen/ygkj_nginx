server {
	listen      127.0.0.1:8443 ssl http2;
	#listen      [::]:8443 ssl http2;
	server_name  localhost;
	ssi on;

	charset gbk;
	#ssl                  on;
	ssl_certificate      /etc/pki/tls/certs/localhost.crt;
	ssl_certificate_key  /etc/pki/tls/private/localhost.key;
	ssl_dhparam /etc/pki/tls/certs/dhparams.pem;

	root /var/www/html;
	index index.html index.php;
	error_page 404  /;
	error_page 403  /;
	
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 10m;

	ssl_protocols TLSv1.2;
	ssl_ciphers  HIGH:!aNULL:!MD5:!SHA1:!DES:!3DES:!DHE:!RSA;
	ssl_prefer_server_ciphers   on;
	
	# php-fpm状态信息
	location = /backend_status {
        include /etc/nginx/common/phpfpm_backend.conf;
    }
	
	include /etc/nginx/module/admin.conf;
	
	location ^~ /vendor {
                deny all;
                return 403;
    }

	location ~* /composer\.(json|lock)$ {
			deny all;
			return 403;
	}

	location ~ \.(php)?$ {
		include /etc/nginx/common/phpfpm_backend.conf;
		
	}

	location /wss {
		proxy_pass http://127.0.0.1:10000;
           		proxy_http_version 1.1;
           		proxy_set_header Upgrade $http_upgrade;
           		proxy_set_header Connection "upgrade";
           		# 这部分是利用http头透传真实客户端ip
           		proxy_set_header X-Real-IP $remote_addr;
           		keepalive_timeout 70;
           		proxy_connect_timeout 4s;     #配置点1
           		proxy_read_timeout 180s;      #配置点2，如果没效，可以考虑这个时间配置长一点
           		proxy_send_timeout 12s;
	}

}
