
server {
    listen 17443 ssl;
    listen  [::]:17443 ssl;
    http2 on;
    ssi on;
    server_name localhost;
    
    #charset gbk;  强制gbk，零信任http代理页面会乱码，移至每个location中
    #ssl                  on;
    include /opt/SJRJ/InG/etc/nginx/common/sslcert.conf;
    ssl_dhparam /opt/SJRJ/InG/etc/pki/tls/certs/dhparams.pem;
    
    root /opt/SJRJ/InG/var/www/html;
    index asm_index_redirect.php index.php index.html index.htm;

    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 10m;    
    #ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers  HIGH:!aNULL:!MD5:!kRSA;
    ssl_prefer_server_ciphers   on;
    underscores_in_headers on;

    client_body_temp_path  /opt/SJRJ/InG/tmp/logs/nginx 1 2;
    error_page 404  =200 /;
	
    ssl_certificate_by_lua_block {
        ifztp.http_ssl_phase()
    }
    
    #网关流量 增加header头 IFZTP-GW-ACCESS：1
    rewrite_by_lua_block {
        ifztp.gateway_header_setflag()
    }

    include /opt/SJRJ/InG/etc/nginx/module/access_gateway.conf;
    include /opt/SJRJ/InG/etc/nginx/module/ifztp.conf;
}
