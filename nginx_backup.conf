user apache apache;
worker_processes  4;
worker_cpu_affinity 1000 0100 0010 0001;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

worker_rlimit_nofile 51200;
worker_shutdown_timeout 600s;

events {
    use epoll;
    worker_connections  51200;
}


http {
    include  mime.types;
    default_type  application/octet-stream;
    server_names_hash_bucket_size 128;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_max_body_size 1024m;
    client_body_buffer_size 256k;
    client_header_timeout 120;

    sendfile on;
    tcp_nopush on;
    fastcgi_intercept_errors on;

    server_tokens off;
    keepalive_timeout 10 10;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;

    gzip  on;
    gzip_min_length  1000;
    gzip_proxied     expired no-cache no-store private auth;
    gzip_types       text/plain text/css text/xml text/javascript application/x-javascript application/xml application/rss+xml application/xhtml+xml application/atom_xml;
    gzip_disable "MSIE [1-6].(?!.*SV1)";
    log_format  access  '$remote_addr - $remote_user [$time_local] "$request" '
	'$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" $http_x_forwarded_for';
    server {
	listen 80;
	server_name localhost;
	root /opt/SJRJ/InG/var/www/html;
	index index.html index.htm index.php;
	gzip off;
    charset gbk;
	client_body_temp_path  /opt/SJRJ/InG/tmp/logs/nginx 1 2;
	error_page 404  /index.html;
    location ~ /download/getip.php{
        echo IP:$remote_addr;
        break;
    }
	location ~ \.(php)?$ {
        proxy_pass http://127.0.0.1:9000;
        proxy_connect_timeout 60s;
        proxy_read_timeout 5400s;
        proxy_send_timeout 5400s;
        include proxy.conf;
#fastcgi_pass  unix:/tmp/php-fpm.sock;
#fastcgi_index index.php;
#fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#include fastcgi_params;
    }

	location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
	{
	    expires      30d;
	}

	location ~ .*\.(js|css)?$
	{
	    expires      12h;
	}
	location ~ .*\.(tgz|conf)$
	{
	    set $forbid_flag 0;
	    if ($remote_addr ~ (127.0.0.1|^191.*))
	    {
		set $forbid_flag "${forbid_flag}1";
	    }
	    if ($http_user_agent ~* 'wget')
	    {
		set $forbid_flag "${forbid_flag}1";
	    }
	    if ($http_referer ~ ^$)
	    {
		set $forbid_flag "${forbid_flag}2";
	    }
	    if ($forbid_flag = "02")
	    {
		return 404;
	    }
	}

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

    include vhost/*.conf;
    
    server {
        listen       443;
        server_name  localhost;

        charset gbk;
        ssl                  on;
        ssl_certificate      /opt/SJRJ/InG/etc/pki/tls/certs/localhost.crt;
        ssl_certificate_key  /opt/SJRJ/InG/etc/pki/tls/private/localhost.key;
	ssl_dhparam /opt/SJRJ/InG/etc/pki/tls/certs/dhparams.pem;

	root /opt/SJRJ/InG/var/www/html;
	index index.html index.htm index.php;
	error_page 404  /index.html;
	error_page 403  /index.html;
        ssl_session_timeout  5m;

        ssl_protocols TLSv1.2;
        ssl_ciphers  HIGH:!aNULL:!MD5:!RSA;
        ssl_prefer_server_ciphers   on;

        #location / {
        #   root   html;
        #    index  index.html index.htm;
        #}
	location ~ \.(php)?$ {
            proxy_pass http://127.0.0.1:9004;
            include proxy.conf;
		#fastcgi_pass  unix:/tmp/php-fpm.sock;
		#fastcgi_index index.php;
		#fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		#include fastcgi_params;
	}
    }

    server {
        listen       [::]:44346;
        server_name  localhost;

        charset gbk;
        ssl                  on;
        ssl_certificate      /opt/SJRJ/InG/etc/pki/tls/certs/localhost.crt;
        ssl_certificate_key  /opt/SJRJ/InG/etc/pki/tls/private/localhost.key;
        ssl_dhparam /opt/SJRJ/InG/etc/pki/tls/certs/dhparams.pem;

        root /opt/SJRJ/InG/var/www/html;
        index index.html index.htm index.php;
        error_page 404  /index.html;
        error_page 403  /index.html;
        ssl_session_timeout  5m;

        ssl_protocols TLSv1.2;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers   on;

        rewrite ^/(.*)$ http://$host/$1 last;
    }

    log_format weblog   '$remote_addr - $remote_user [$time_local] "$request" '
    			'$status $body_bytes_sent "$http_referer" '
			'"$http_user_agent" $http_x_forwarded_for';
    error_log /opt/SJRJ/InG/tmp/logs/nginx/error.log  warn;
    access_log /opt/SJRJ/InG/tmp/logs/nginx/access.log weblog;
    

}

