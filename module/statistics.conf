include /opt/SJRJ/InG/etc/nginx/common/host_limit.conf;
location ^~ /statistics {
	alias  /opt/SJRJ/InG/var/www/admin.asm.com/public;
    	try_files $uri $uri/ @statistics;
        location ~ \.(php)?$ {
                fastcgi_index index.php;
                fastcgi_pass fastcgi_backend;
                fastcgi_keep_conn on;
                fastcgi_param  DOCUMENT_ROOT      $document_root;
                fastcgi_param SCRIPT_FILENAME $document_root/index.php;
                fastcgi_ignore_client_abort on;
                include /opt/SJRJ/InG/etc/asm/nginx/*.conf;
                include fastcgi_params;
        }
}

location @statistics {
    rewrite /statistics/(.*)$ /statistics/index.php?/$1 last;
}
