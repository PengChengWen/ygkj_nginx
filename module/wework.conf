location /wwopen/sso/v1/qrConnect{
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Accept-Encoding "";

  proxy_cookie_domain ~(?i)\.?work\.weixin\.qq\.com $host;
  proxy_cookie_domain ~(?i)\.?open\.work\.weixin\.qq\.com $host;
  proxy_redirect https://open.work.weixin.qq.com/ $scheme://$http_host/;

  sub_filter "//js.aq.qq.com/js" $scheme://$http_host;
  sub_filter "//wwcdn.weixin.qq.com" $scheme://$http_host;
  sub_filter "//open.work.weixin.qq.com" $scheme://$http_host;
  sub_filter_once off;

  set $tar https://open.work.weixin.qq.com;
  proxy_pass $tar;
}
location /wwopen/sso/qrConnect{
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_cookie_domain ~(?i)\.?work\.weixin\.qq\.com $host;
  proxy_cookie_domain ~(?i)\.?open\.work\.weixin\.qq\.com $host;
  proxy_redirect https://open.work.weixin.qq.com/ $scheme://$http_host/;

  set $tar https://open.work.weixin.qq.com;
  proxy_pass $tar;
}
location ^~ /wwopen/{
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_cookie_domain ~(?i)\.?work\.weixin\.qq\.com $host;
  proxy_cookie_domain ~(?i)\.?open\.work\.weixin\.qq\.com $host;
  proxy_redirect https://open.work.weixin.qq.com/ $scheme://$http_host/;

  set $tar https://open.work.weixin.qq.com;
  proxy_pass $tar;
}
location = /aq_common.js{
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $tar https://js.aq.qq.com/js/aq_common.js;
  proxy_pass $tar;
}
location ^~ /node/wwopen/{
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $tar https://wwcdn.weixin.qq.com;
  proxy_pass $tar;
}