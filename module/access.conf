include /opt/SJRJ/InG/etc/nginx/common/host_limit.conf;

# Forbid access if there is no refer
location ^~ /tp/ {
    valid_referers server_names ~.;
    if ($invalid_referer) {
        return 403;
    }
}

location ^~ /access {
    charset gbk;
	add_header Access-Control-Allow-Origin *;
	add_header Access-Control-Allow-Credentials 'true';
	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
	add_header Access-Control-Allow-Headers 'Extend-Data,Serial-Num,DNT,web-token,app-token,Authorization,Accept,Origin,Keep-Alive,User-Agent,X-Mx-ReqToken,X-Data-Type,X-Auth-Token,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept-Encoding,Accept-Language,Connection,Content-Length,Cookie,Host,Pragma,Referer,sec-ch-ua,sec-ch-ua-mobile,sec-ch-ua-platform,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Session-Num,Web-Token';
	add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
	if ($request_method = 'OPTIONS') {
		return 204;
	}
	set $is_exist_filename 1;

	if ($request_filename != '/opt/SJRJ/InG/var/www/html/access/index.php') {
		set $is_exist_filename 0;
	        rewrite ^(.*)$ /access/index.php?rewrite=$1 last;
	}

	# else
	if ($is_exist_filename = 1) {
		root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
	}
	include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ^~ /source {
    charset gbk;
	rewrite ^(.*)$ $scheme://$http_host/access/ui/#/source/list permanent;
}
location ^~ /access/ui {
	charset utf-8;
	root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}

location ^~ /client/ui {
        charset utf-8;
        root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}

location ^~ /mobile/ui {
        charset utf-8;
        root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}

location ^~ /client {
    charset utf-8;
}

location ^~ /download/soft/ {
    charset gbk;
	error_page 404 /404.html;
}
location ^~ /backend {
        charset gbk;
        alias  /opt/SJRJ/InG/var/www/admin.asm.com/public;
        try_files $uri $uri/ @backend;
        location ~ \.(php)?$ {
                fastcgi_index index.php;
                fastcgi_pass fastcgi_backend;
                fastcgi_keep_conn on;
                fastcgi_param  DOCUMENT_ROOT      $document_root;
                fastcgi_param SCRIPT_FILENAME $document_root/index.php;
                fastcgi_ignore_client_abort on;
                include /opt/SJRJ/InG/etc/asm/nginx/*.conf;
                include fastcgi_params;
        }
}

location @backend{
    charset gbk;
    rewrite /backend/(.*)$ /backend/index.php?/$1 last;
}
