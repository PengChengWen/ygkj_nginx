include /opt/SJRJ/InG/etc/nginx/common/host_limit.conf;
include /opt/SJRJ/InG/etc/nginx/module/dingtalk.conf;
include /opt/SJRJ/InG/etc/nginx/module/wework.conf;
include /opt/SJRJ/InG/etc/nginx/module/feishu.conf;

location ~ /frontend_status {
    charset gbk;
    include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ~ /download/getip.php {
    charset gbk;
    echo IP:$remote_addr;
    break;
}

location ~ /reloaduptime {
    redis2_query auth InfogoAsmPass168;
    default_type text/plain;
    redis2_query hset dasmreport $arg_ip $arg_time;
    redis2_pass 127.0.0.1:6379;
}

location ~ /vendor {
    charset gbk;
    deny all;
    return 403;
}

location ~* /composer\.(json|lock)$ {
    charset gbk;
    deny all;
    return 403;
}

# Forbid access if there is no refer
location = /tp/index.html {
        root /opt/SJRJ/InG/var/www/html;
        try_files $uri =404;
}
location ^~ /tp/ {
    valid_referers server_names ~.;
    if ($invalid_referer) {
        return 403;
    }
}

location ^~ /access {
    charset gbk;
	add_header Access-Control-Allow-Origin *;
	add_header Access-Control-Allow-Credentials 'true';
	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
	add_header Access-Control-Allow-Headers 'Extend-Data,Serial-Num,DNT,web-token,app-token,Authorization,Accept,Origin,Keep-Alive,User-Agent,X-Mx-ReqToken,X-Data-Type,X-Auth-Token,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept-Encoding,Accept-Language,Connection,Content-Length,Cookie,Host,Pragma,Referer,sec-ch-ua,sec-ch-ua-mobile,sec-ch-ua-platform,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Session-Num,Web-Token,device-diskid';
	add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
	if ($request_method = 'OPTIONS') {
		return 204;
	}
	set $is_exist_filename 1;

	if ($request_filename != '/opt/SJRJ/InG/var/www/html/access/index.php') {
		set $is_exist_filename 0;
	        rewrite ^(.*)$ /access/index.php?rewrite=$1 last;
	}

	# else
	if ($is_exist_filename = 1) {
		root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
	}
	include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ^~ /access/2.0/ {
        proxy_pass http://[::1]:50005;
        include proxy.conf;
}

location /access/ws {
        proxy_pass http://[::1]:50005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        keepalive_timeout 70;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 12s;
}

location ^~ /passport {
    charset gbk;
    set $is_exist_filename 1;

    if ($request_filename != '/opt/SJRJ/InG/var/www/html/passport/index.php') {
        set $is_exist_filename 0;
        rewrite ^(.*)$ /passport/index.php?rewrite=$1 last;
    }

    # else
    if ($is_exist_filename = 1) {
        root /opt/SJRJ/InG/var/www/passport.asm.com/webroot;
    }
    include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ^~ /source {
    charset gbk;
	rewrite ^(.*)$ $scheme://$http_host/access/ui/#/source/list permanent;
}
location ^~ /access/ui {
	charset utf-8;
	root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}

location ^~ /client/ui {
        charset utf-8;
        root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}

location ^~ /mobile/ui {
        charset utf-8;
        root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}

location ^~ /client {
    charset utf-8;
}

location ^~ /download/soft/ {
    charset gbk;
	error_page 404 /404.html;
}
location ^~ /backend {
        charset gbk;
        alias  /opt/SJRJ/InG/var/www/admin.asm.com/public;
        try_files $uri $uri/ @backend;
        location ~ \.(php)?$ {
                include /opt/SJRJ/InG/etc/nginx/common/phpfpm_admin.conf;
        }
}

location @backend{
    charset gbk;
    rewrite /backend/api/rpcserve/(.*)$ /backend/index.php?/api/rpcserve/$1 last;
    rewrite /backend/api/access/(.*)$ /backend/index.php?/api/access/$1 last;
}

    location ^~  /api/Rpc {
        charset gbk;
        include /opt/SJRJ/InG/etc/nginx/common/phpfpm_backend.conf;
    }
