location ^~ /access/ui {
    rewrite ^(.*) https://$host/admin break;
}

location ~ /a/(index.html|auth.html) {
     rewrite ^(.*) https://$host/admin break;

}
location ~ /a2/(index.html|auth.html) {
     rewrite ^(.*) https://$host/admin break;

}
location ~ /a/mobile/(.*) {
    rewrite ^(.*) https://$host/admin break;
}
location ~ /a2/mobile/(.*) {
    rewrite ^(.*) https://$host/admin break;
}

if ($request_uri ~* "infoprocess|net_auth") {
    rewrite ^(.*) https://$host/admin break;
}

location ~ /download/getip.php{
    echo IP:$remote_addr;
    break;
}

location ~ /reloaduptime{
    redis2_query auth InfogoAsmPass168;
    default_type text/plain;
    redis2_query hset dasmreport $arg_ip $arg_time;
    redis2_pass 127.0.0.1:6379;
}

location ~ /vendor {
    deny all;
    return 403;
}

location ~* /composer\.(json|lock)$ {
    deny all;
    return 403;
}

location ^~ /access {
		set $is_exist_filename 1;

		if ($request_uri ~* "infoprocess|auth") {
			rewrite ^(.*) https://$host/admin break;
		}
		if ($request_filename != '/opt/SJRJ/InG/var/www/html/access/index.php') {
			set $is_exist_filename 0;
			rewrite ^(.*)$ /access/index.php?rewrite=$1 last;
		}
		# else
		if ($is_exist_filename = 1) {
			root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
		}
		include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ^~ /passport {
		charset gbk;
		set $is_exist_filename 1;

		if ($request_filename != '/opt/SJRJ/InG/var/www/html/passport/index.php') {
			set $is_exist_filename 0;
			rewrite ^(.*)$ /passport/index.php?rewrite=$1 last;
		}

		# else
		if ($is_exist_filename = 1) {
			root /opt/SJRJ/InG/var/www/passport.asm.com/webroot;
		}
		include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ^~ /backend {
        charset gbk;
        alias  /opt/SJRJ/InG/var/www/admin.asm.com/public;
        try_files $uri $uri/ @backend;
        location ~ \.(php)?$ {
                include /opt/SJRJ/InG/etc/nginx/common/phpfpm_admin.conf;
        }
}

location @backend{
    charset gbk;
    rewrite /backend/api/rpcserve/(.*)$ /backend/index.php?/api/rpcserve/$1 last;
}

location ^~  /api/Rpc {
    charset gbk;
    include /opt/SJRJ/InG/etc/nginx/common/phpfpm_backend.conf;
}

location ~ \.(php)?$ {
    allow 127.0.0.1;
    include /opt/SJRJ/InG/etc/allow.conf;
    deny all;
    include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
    expires      30d;
}

location ~ .*\.(js|css)?$ {
    expires      12h;
}
location ~ .*\.(tgz|conf|rar)$ {
    set $forbid_flag 0;
    if ($remote_addr ~ (127.0.0.1|^191.*)) {
        set $forbid_flag "${forbid_flag}1";
    }
    if ($http_user_agent ~* 'wget') {
        set $forbid_flag "${forbid_flag}1";
    }
    if ($http_referer ~ ^$) {
        set $forbid_flag "${forbid_flag}2";
    }
    if ($request_uri ~* "/download/patchupdate.rar") {
        set $forbid_flag "${forbid_flag}3";
    }
    if ($forbid_flag = "02") {
        return 404;
    }
}
