location ^~ /access/gateway {
    charset gbk;
	add_header Access-Control-Allow-Origin *;
	add_header Access-Control-Allow-Credentials 'true';
	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
	add_header Access-Control-Allow-Headers 'Extend-Data,Serial-Num,DNT,web-token,app-token,Authorization,Accept,Origin,Keep-Alive,User-Agent,X-Mx-ReqToken,X-Data-Type,X-Auth-Token,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept-Encoding,Accept-Language,Connection,Content-Length,Cookie,Host,Pragma,Referer,sec-ch-ua,sec-ch-ua-mobile,sec-ch-ua-platform,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Session-Num,Web-Token';
	add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
	if ($request_method = 'OPTIONS') {
		return 204;
	}
	set $is_exist_filename 1;

	if ($request_filename != '/opt/SJRJ/InG/var/www/html/access/gateway/index.php') {
		set $is_exist_filename 0;
	        rewrite ^(.*)$ /access/gateway/index.php?rewrite=$1 last;
	}

	# else
	if ($is_exist_filename = 1) {
		root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
	}
	include /opt/SJRJ/InG/etc/nginx/common/phpfpm.conf;
}

location ^~ /access/ui {
	charset utf-8;
	root /opt/SJRJ/InG/var/www/access.asm.com/webroot;
}