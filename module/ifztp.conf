        location ^~/guacamole/ {
                set $ter_proxy_protocol "";
                set $ter_proxy_target "";
                set $ter_proxy_port "";

                access_by_lua_block {
                        ifztp.terminal_access_phase()
                }
                #log_by_lua_block {
                #    ifztp.http_log_phase()
                #}

                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Credentials 'true';
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,web-token,app-token,Authorization,Accept,Origin,Keep-Alive,User-Agent,X-Mx-ReqToken,X-Data-Type,X-Auth-Token,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';

                proxy_pass $ter_proxy_protocol://$ter_proxy_target:$ter_proxy_port;

                proxy_http_version 1.1;
                proxy_set_header Origin '';
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";

                proxy_redirect  off;
                proxy_set_header  X-Real-IP $remote_addr;
                proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
                index  index.html index.htm;
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Credentials 'true';
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, DALETE';
                add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
                add_header Access-Control-Allow-Headers *;
                if ($request_method = 'OPTIONS') {
                    return 204;
                }
                
                set $proxy_protocol '';
                set $proxy_target '';
                set $proxy_port_go '';
                set $var_x_forwarded_for        $remote_addr;
                set $var_x_forwarded_proto      $scheme;
                set $var_x_forwarded_host       $host;
                set $var_x_forwarded_port       $server_port;
                set $var_origin '';
                if ($http_x_forwarded_for != "") {
                        set $var_x_forwarded_for "${http_x_forwarded_for}, ${remote_addr}";
                }
                if ($http_x_forwarded_proto != "") {
                        set $var_x_forwarded_proto $http_x_forwarded_proto;
                }
                if ($http_x_forwarded_host != "") {
                        set $var_x_forwarded_host $http_x_forwarded_host;
                }
                if ($http_x_forwarded_port != "") {
                        set $var_x_forwarded_port $http_x_forwarded_port;
                }

                proxy_set_header   X-Forwarded-Proto    $var_x_forwarded_proto;
                proxy_set_header   X-Forwarded-Host     $var_x_forwarded_host;
                proxy_set_header   X-Forwarded-Port     $var_x_forwarded_port;
                proxy_set_header Accept-Encoding "";
                
                header_filter_by_lua_block {
                       ifztp.http_header_replace_phase()
                }
                
                body_filter_by_lua_block {
                        ifztp.http_body_replace_phase()
                        ifztp.http_body_formfill_phase()
                        ifztp.http_body_filter_watermark_phase()
                }

                access_by_lua_block {
                        ifztp.http_access_phase()
                }
                
                log_by_lua_block {
                        ifztp.http_log_phase()
                }
                
                proxy_connect_timeout 300s;
                proxy_read_timeout 300s;
                proxy_ssl_server_name on;
                proxy_ssl_session_reuse off;
                proxy_http_version 1.1;
                proxy_set_header Host $var_x_forwarded_host;
                proxy_set_header Origin          $var_origin;
                proxy_set_header Upgrade         $http_upgrade;
                proxy_set_header Connection      $http_connection;
                proxy_set_header X-Forwarded-For      $var_x_forwarded_for;
                
                proxy_pass $proxy_protocol://$proxy_target:$proxy_port_go$request_uri;
                proxy_bind $http_x_proxy_bind transparent;
                proxy_pass_request_headers on;
        }